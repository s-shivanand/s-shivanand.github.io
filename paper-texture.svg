<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="folds" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.026" numOctaves="3" seed="12" stitchTiles="stitch" result="relief"/>
    <feDiffuseLighting in="relief" surfaceScale="9" diffuseConstant="1" lighting-color="#ffffff">
      <feDistantLight azimuth="225" elevation="40"/>
    </feDiffuseLighting>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.6" intercept="-0.25"/>
      <feFuncG type="linear" slope="1.6" intercept="-0.25"/>
      <feFuncB type="linear" slope="1.6" intercept="-0.25"/>
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" filter="url(#folds)" opacity="0.28"/>
  <rect width="180" height="180" filter="url(#grain)" opacity="0.14"/>
</svg>
